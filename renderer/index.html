<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/jira.css">
</head>
<body>
  <div id="app">
    <div id="corner-menu-wrap">
      <img src="saturn.png" alt="Special functions" id="corner-logo" title="Special functions">
      <div id="corner-menu" class="corner-menu">
        <button id="btn-reset-app" class="corner-menu-item warn"><span class="corner-menu-icon corner-menu-icon-refresh">⟲</span>Hard Refresh</button>
        <div class="corner-menu-divider"></div>
        <button id="btn-stop-all" class="corner-menu-item danger"><span class="corner-menu-icon">■</span>Stop All</button>
      </div>
    </div>
    <nav id="sidebar">
      <div class="sidebar-header">
        <span class="logo-text">dashboard</span>
      </div>
      <div id="nav-items"></div>
      <div class="sidebar-add">
        <button id="btn-add-category" class="nav-btn add-btn" title="Add Category">
          <span class="nav-icon">+</span>
          <span class="nav-label">Add Category</span>
        </button>
      </div>
      <div class="sidebar-footer">
        <button id="btn-tickets" class="nav-btn" title="Jira Tickets">
          <span class="nav-icon nav-icon-svg"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V7z"></path><line x1="13" y1="7" x2="13" y2="9"></line><line x1="13" y1="15" x2="13" y2="17"></line><line x1="13" y1="11" x2="13" y2="13"></line></svg></span>
          <span class="nav-label">Tickets</span>
        </button>
        <button id="btn-settings" class="nav-btn" title="Settings">
          <span class="nav-icon">⚙</span>
          <span class="nav-label">Settings</span>
        </button>
      </div>
    </nav>
    <main id="content"></main>
  </div>

  <!-- Templates -->
  <template id="tmpl-category">
    <div class="category-view">
      <div class="category-header">
        <h2 class="category-title"></h2>
        <span class="category-count"></span>
        <!-- Inline rename (hidden by default) -->
        <div class="inline-rename" style="display:none">
          <input type="text" class="rename-input" placeholder="Category name">
          <input type="text" class="rename-icon" placeholder="🚀" maxlength="2" style="width:45px" title="Icon">
          <button class="rename-save">Save</button>
          <button class="rename-delete">Delete</button>
        </div>
        <button class="btn-edit-cat" title="Edit">✎</button>
      </div>
      <div class="service-grid"></div>
      <div class="add-menu-wrap">
        <button class="btn-add-item">+ Add</button>
        <div class="add-menu" style="display:none">
          <button class="add-menu-opt" data-type="service">🔧 Service</button>
          <button class="add-menu-opt" data-type="build">🔨 Build</button>
          <button class="add-menu-opt" data-type="shortcut">⚡ Shortcut</button>
        </div>
      </div>
    </div>
  </template>

  <template id="tmpl-service-card">
    <div class="service-card">
      <div class="card-header">
        <div class="status-dot"></div>
        <div class="card-info">
          <div class="name-row">
            <h3 class="service-name"></h3>
            <button class="copy-cmd-btn" title="Copy terminal command" style="display:none"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="1"></rect><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path></svg></button>
          </div>
          <p class="service-desc"></p>
        </div>
        <div class="card-actions">
          <span class="uptime" title="Running time (hours:minutes)" style="display:none"></span>
          <input type="text" class="inline-input" style="display:none" placeholder="">
          <div class="flag-dropdown" style="display:none" title="Flag / profile">
            <button type="button" class="flag-dropdown-btn"></button>
            <div class="flag-dropdown-menu"></div>
          </div>
          <button class="edit-svc-btn" title="Edit service">✎</button>
          <button class="restart-btn" title="Restart" style="display:none">↻</button>
          <button class="cancel-btn" title="Cancel" style="display:none">✕</button>
          <button class="toggle-btn" title="Toggle"></button>
        </div>
      </div>
      <div class="card-footer">
        <div class="service-urls"></div>
      </div>
    </div>
  </template>

  <template id="tmpl-settings">
    <div class="settings-view">
      <h2>Settings</h2>

      <div class="settings-section">
        <h3>Poll Interval</h3>
        <div class="setting-row">
          <label>Check service status every</label>
          <select id="poll-interval">
            <option value="2000">2 seconds</option>
            <option value="5000">5 seconds</option>
            <option value="10000">10 seconds</option>
            <option value="30000">30 seconds</option>
          </select>
        </div>
      </div>

      <div class="settings-section">
        <h3>Start Timeout</h3>
        <div class="setting-row">
          <label>Cancel loading spinner after</label>
          <select id="start-timeout">
            <option value="30">30 seconds</option>
            <option value="60">1 minute</option>
            <option value="90">90 seconds</option>
            <option value="120">2 minutes</option>
            <option value="180">3 minutes</option>
            <option value="300">5 minutes</option>
            <option value="0">Never (manual only)</option>
          </select>
        </div>
      </div>

      <div class="settings-section">
        <h3>Browser</h3>
        <div class="setting-row">
          <label>Open links in</label>
          <select id="browser-select"></select>
        </div>
      </div>

      <div class="settings-section">
        <h3>Appearance</h3>
        <div class="setting-row">
          <label>Background animations</label>
          <label class="switch">
            <input type="checkbox" id="anim-toggle">
            <span class="switch-track"></span>
          </label>
        </div>
        <div class="setting-row" id="anim-speed-row">
          <label>Animation speed</label>
          <div class="slider-wrap">
            <input type="range" id="anim-speed" min="0.25" max="3" step="0.25" value="1">
            <span id="anim-speed-val" class="slider-val">1.0×</span>
          </div>
        </div>
        <div class="setting-row">
          <label>Accent color <span class="settings-hint">buttons, highlights, borders</span></label>
          <div class="color-row">
            <span class="theme-swatch" data-color="#a78bfa" title="Purple (default)" style="background:#a78bfa"></span>
            <span class="theme-swatch" data-color="#818cf8" title="Blue" style="background:#818cf8"></span>
            <span class="theme-swatch" data-color="#4ade80" title="Green" style="background:#4ade80"></span>
            <span class="theme-swatch" data-color="#f472b6" title="Pink" style="background:#f472b6"></span>
            <span class="theme-swatch" data-color="#fb923c" title="Orange" style="background:#fb923c"></span>
            <span class="theme-swatch" data-color="#22d3ee" title="Cyan" style="background:#22d3ee"></span>
            <input type="color" id="theme-color" value="#a78bfa" title="Custom">
          </div>
        </div>
        <div class="setting-row">
          <label>Background color <span class="settings-hint">the app's dark base</span></label>
          <div class="color-row">
            <span class="bg-swatch" data-color="#050510" title="Midnight (default)" style="background:#050510"></span>
            <span class="bg-swatch" data-color="#0a0a0a" title="Black" style="background:#0a0a0a"></span>
            <span class="bg-swatch" data-color="#0c1322" title="Navy" style="background:#0c1322"></span>
            <span class="bg-swatch" data-color="#120a1e" title="Plum" style="background:#120a1e"></span>
            <span class="bg-swatch" data-color="#0a1410" title="Forest" style="background:#0a1410"></span>
            <input type="color" id="bg-color" value="#050510" title="Custom">
          </div>
        </div>
        <div class="setting-row">
          <label>Text color <span class="settings-hint">main text</span></label>
          <div class="color-row">
            <span class="text-swatch" data-color="#e0ddf0" title="Default" style="background:#e0ddf0"></span>
            <span class="text-swatch" data-color="#ffffff" title="White" style="background:#ffffff"></span>
            <span class="text-swatch" data-color="#cbd5e1" title="Slate" style="background:#cbd5e1"></span>
            <span class="text-swatch" data-color="#fde68a" title="Amber" style="background:#fde68a"></span>
            <span class="text-swatch" data-color="#a7f3d0" title="Mint" style="background:#a7f3d0"></span>
            <input type="color" id="text-color" value="#e0ddf0" title="Custom">
          </div>
        </div>
        <div class="setting-row">
          <label>Reset appearance <span class="settings-hint">colors &amp; animations only</span></label>
          <button id="btn-reset-appearance" class="btn-secondary">Reset to Default</button>
        </div>
      </div>

      <div class="settings-section">
        <h3>Jira</h3>
        <div class="setting-row">
          <label>Enable Tickets page</label>
          <label class="switch">
            <input type="checkbox" id="jira-enabled-toggle">
            <span class="switch-track"></span>
          </label>
        </div>
        <div id="jira-config-fields">
          <p class="settings-hint">Connect your Jira instance to view assigned tickets on the Tickets page. Uses a Personal Access Token (Profile &rarr; Personal Access Tokens in Jira).</p>
          <div class="form-row">
            <label>Jira Base URL</label>
            <input type="text" id="jira-base-url" placeholder="https://jira.devops.va.gov">
          </div>
          <div class="form-row">
            <label>Personal Access Token</label>
            <input type="password" id="jira-token" placeholder="Paste your Jira PAT">
          </div>
          <div class="form-row">
            <label>JQL <span class="optional">(optional — defaults to your unresolved tickets)</span></label>
            <input type="text" id="jira-jql" placeholder="assignee = currentUser() AND resolution = Unresolved ORDER BY updated DESC">
          </div>
          <div class="form-actions">
            <button id="btn-save-jira" class="btn-secondary">Save Jira Settings</button>
          </div>
          <p id="jira-save-status" class="settings-hint"></p>
        </div>
      </div>

      <div class="settings-section">
        <h3>Config File</h3>
        <p class="settings-hint">All categories and services are saved here</p>
        <div class="config-path-row">
          <code id="config-path"></code>
          <button id="btn-open-config" class="btn-open-config">Open</button>
        </div>
      </div>

      <div class="settings-section">
        <h3>App</h3>
        <button id="btn-refresh" class="btn-secondary">Refresh Dashboard</button>
      </div>

      <div class="settings-section">
        <h3>Danger Zone</h3>
        <p class="settings-hint">Wipe every category and service. Your appearance settings are kept.</p>
        <button id="btn-wipe-services" class="btn-danger">Wipe All Services</button>
        <p class="settings-hint" style="margin-top:14px">Reset the entire app to factory defaults — categories, services, appearance, and Jira settings. This cannot be undone.</p>
        <button id="btn-wipe-everything" class="btn-danger">Wipe Everything</button>
      </div>

      <p id="app-version" class="app-version"></p>
    </div>
  </template>

  <template id="tmpl-category-form">
    <div class="command-form inline-form">
      <input type="text" class="cat-name" placeholder="Category name...">
      <input type="text" class="cat-icon" placeholder="🚀" maxlength="2" style="width: 50px;" title="Icon (emoji)">
      <button class="btn-save">Save</button>
      <button class="btn-cancel">✕</button>
    </div>
  </template>



  <template id="tmpl-command-form">
    <div class="command-form">
      <div class="form-row">
        <label>Name</label>
        <input type="text" class="cmd-name" placeholder="My Service">
      </div>
      <div class="form-row">
        <label>Description</label>
        <input type="text" class="cmd-desc" placeholder="Node server :3000">
      </div>
      <div class="form-row">
        <label>Port</label>
        <input type="number" class="cmd-port" placeholder="3000">
      </div>
      <div class="form-row">
        <label>Process match <span class="optional">(optional — if multiple services share this port, enter text from this one's command, e.g. the jar name, so status isn't confused)</span></label>
        <input type="text" class="cmd-process-match" placeholder="e.g. my-app.jar or a unique word from the command">
      </div>
      <div class="form-row">
        <label>Running color <span class="optional">(the hue shown when this service is on)</span></label>
        <div class="color-row">
          <input type="color" class="cmd-running-color" value="#4ade80">
          <button type="button" class="btn-reset-color">Reset to default</button>
        </div>
      </div>
      <div class="form-row">
        <label>Start Command</label>
        <textarea class="cmd-start" placeholder="cd ~/project && npm start &" rows="2"></textarea>
      </div>
      <div class="form-row">
        <label>Stop Command <span class="optional">(optional — kills port if empty)</span></label>
        <textarea class="cmd-stop" placeholder="" rows="2"></textarea>
      </div>
      <div class="form-row">
        <label>Flag toggle <span class="optional">(optional — put {{flag}} in the start command; pick a value from the card dropdown)</span></label>
        <div class="cmd-flags"></div>
        <button type="button" class="btn-add-flag">+ Add flag option</button>
      </div>
      <div class="form-row">
        <label>Links <span class="optional">(optional — open in Edge)</span></label>
        <div class="cmd-links"></div>
        <button type="button" class="btn-add-link">+ Add link</button>
      </div>
      <div class="form-row form-row-check">
        <label class="check-label">
          <input type="checkbox" class="cmd-requires-input">
          Requires input before starting <span class="optional">(e.g. verification code)</span>
        </label>
      </div>
      <div class="form-row cmd-input-label-row" style="display:none">
        <label>Input Label</label>
        <input type="text" class="cmd-input-label" placeholder="Verification code">
      </div>
      <div class="form-actions">
        <button class="btn-save">Save</button>
        <button class="btn-cancel">Cancel</button>
        <button class="btn-delete" style="display:none">Delete</button>
      </div>
    </div>
  </template>

  <template id="tmpl-build-form">
    <div class="command-form">
      <div class="form-row">
        <label>Name</label>
        <input type="text" class="build-name" placeholder="My Java Project">
      </div>
      <div class="form-row">
        <label>Description</label>
        <input type="text" class="build-desc" placeholder="Builds the project jar">
      </div>
      <div class="form-row">
        <label>Working Directory <span class="optional">(optional — folder the build command runs in)</span></label>
        <input type="text" class="build-dir" placeholder="~/Repositories/rona-repos/bip-ronab-api">
      </div>
      <div class="form-row">
        <label>Build Command</label>
        <textarea class="build-command" placeholder="mvn clean install -Dspring.config.name=bip-ronab-api-local-orcl -DskipTests" rows="2"></textarea>
      </div>
      <div class="form-row">
        <label>Running color <span class="optional">(shown while the build is in progress)</span></label>
        <div class="color-row">
          <input type="color" class="build-running-color" value="#4ade80">
          <button type="button" class="btn-reset-color">Reset to default</button>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-save">Save</button>
        <button class="btn-cancel">Cancel</button>
        <button class="btn-delete" style="display:none">Delete</button>
      </div>
    </div>
  </template>

  <template id="tmpl-shortcut-card">
    <div class="service-card shortcut-card">
      <div class="card-header">
        <div class="shortcut-icon">⚡</div>
        <div class="card-info">
          <h3 class="service-name"></h3>
          <p class="service-desc shortcut-status"></p>
        </div>
        <div class="card-actions">
          <button class="edit-svc-btn" title="Edit shortcut">✎</button>
          <button class="toggle-btn" title="Toggle"></button>
        </div>
      </div>
      <div class="shortcut-services"></div>
    </div>
  </template>

  <template id="tmpl-shortcut-form">
    <div class="command-form">
      <div class="form-row">
        <label>Shortcut Name</label>
        <input type="text" class="shortcut-name" placeholder="Start Frontend Stack">
      </div>
      <div class="form-row">
        <label>Description <span class="optional">(optional)</span></label>
        <input type="text" class="shortcut-desc" placeholder="Starts all frontend services">
      </div>
      <div class="form-row">
        <label>Icon</label>
        <div class="emoji-preset-row"></div>
      </div>
      <div class="form-row">
        <label>Services to include</label>
        <div class="shortcut-service-list"></div>
      </div>
      <div class="form-row">
        <label>Color <span class="optional">(accent color for this shortcut)</span></label>
        <div class="color-row">
          <input type="color" class="shortcut-running-color" value="#4ade80">
          <button type="button" class="btn-reset-color">Reset to default</button>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-save">Save</button>
        <button class="btn-cancel">Cancel</button>
        <button class="btn-delete" style="display:none">Delete</button>
      </div>
    </div>
  </template>

  <script src="js/log-colorize.js"></script>
  <script src="js/app.js"></script>

  <!-- Log Viewer Overlay -->
  <div id="log-overlay" style="display:none">
    <div class="log-panel">
      <div class="log-header">
        <div class="log-title">
          <span class="log-dot"></span>
          <span class="log-service-name"></span>
        </div>
        <div class="log-actions">
          <span class="log-timestamp"></span>
          <button class="log-btn" id="log-popout" title="Open in a resizable window">POP OUT</button>
          <button class="log-btn" id="log-copy-ai" title="Copy a condensed, low-token summary for pasting to an AI assistant">COPY FOR AI</button>
          <button class="log-btn" id="log-clear" title="Clear logs">CLEAR</button>
          <button class="log-btn" id="log-close" title="Close">✕</button>
        </div>
      </div>
      <pre class="log-content"></pre>
    </div>
  </div>
</body>
</html>
